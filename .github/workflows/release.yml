name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Lint & Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - name: Install Luarocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck and unit tests
        run: |
          luacheck src tests
          lua tests/run.lua

  package:
    name: Package AddOn Archive
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build QuestSectionsPlus zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="dist/QuestSectionsPlus"
          mkdir -p "${STAGE_DIR}"
          cp QuestSectionsPlus.toc LICENSE README.md CHANGELOG.md "${STAGE_DIR}/"
          cp -r src "${STAGE_DIR}/"
          (cd dist && zip -r "QuestSectionsPlus-${VERSION}.zip" QuestSectionsPlus)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuestSectionsPlus-*.zip
          generate_release_notes: true
