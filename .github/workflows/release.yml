name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Lint & Test Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 lua-check zip

      - name: Run luacheck and unit tests
        run: |
          luacheck src tests
          lua5.1 tests/run.lua

  package:
    name: Package AddOn Archive
    runs-on: ubuntu-24.04
    needs: [validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build QuestSectionsPlus zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="dist/QuestSectionsPlus"
          mkdir -p "${STAGE_DIR}"
          cp QuestSectionsPlus.toc LICENSE README.md CHANGELOG.md "${STAGE_DIR}/"
          cp -r src "${STAGE_DIR}/"
          (cd dist && zip -r "QuestSectionsPlus-${VERSION}.zip" QuestSectionsPlus)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuestSectionsPlus-*.zip
          generate_release_notes: true
