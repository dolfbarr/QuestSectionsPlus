name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Static Analysis (luacheck)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 lua-check

      - name: Run luacheck
        run: luacheck src tests

  test:
    name: Unit Tests (Lua 5.1)
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1

      - name: Execute headless test suite
        run: lua5.1 tests/run.lua
